<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-ey-ms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="50%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="32" fill="url(#bg-ey-ms)"/>
  
  <!-- EY Yellow Triangle / Badge -->
  <g transform="translate(280, 185)">
    <text x="0" y="25" font-family="system-ui, sans-serif" font-weight="900" font-size="64" fill="#ffe600">EY</text>
  </g>

  <text x="400" y="200" font-family="system-ui, sans-serif" font-weight="300" font-size="42" fill="#ffffff" text-anchor="middle">&amp;</text>

  <!-- Microsoft Grid -->
  <g transform="translate(460, 145) scale(1.1)">
    <rect x="0" y="0" width="36" height="36" fill="#f25022"/>
    <rect x="42" y="0" width="36" height="36" fill="#7fba00"/>
    <rect x="0" y="42" width="36" height="36" fill="#00a4ef"/>
    <rect x="42" y="42" width="36" height="36" fill="#ffb900"/>
  </g>

  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="4">EY &amp; MICROSOFT</text>
  <text x="400" y="370" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#ffe600" text-anchor="middle" letter-spacing="3">AI SKILLS PASSPORT</text>
</svg>
